# Proxy reverso: porta 80 pública -> app na rede interna (${APP_INTERNAL_HOST}:${APP_PORT})
upstream alerta_corrego_app {
    server ${APP_INTERNAL_HOST}:${APP_PORT} max_fails=3 fail_timeout=10s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ${SERVER_HOSTNAME}.${DOMAIN} _;

    access_log ${LOG_DIR}/nginx-access.log;
    error_log  ${LOG_DIR}/nginx-error.log warn;

    server_tokens off;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    client_max_body_size 64k;

    location / {
        proxy_pass http://alerta_corrego_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Página amigável quando a app está fora do ar (ex.: durante o teste de falha)
    error_page 502 503 504 /indisponivel.html;
    location = /indisponivel.html {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Alerta Córrego</title><body style="font-family:sans-serif;padding:24px"><h1>Reiniciando o serviço...</h1><p>O sistema se recupera sozinho em alguns segundos. Em emergência ligue 199 (Defesa Civil).</p></body>';
    }
}
